name: Security

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          # Fetch current security patches instead of using a stale runner toolchain.
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            observe/prometheus/go.mod
            observe/prometheus/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: GOWORK=off govulncheck ./...
      - run: GOWORK=off govulncheck ./...
        working-directory: observe/prometheus
